apiVersion: apps/v1
kind: Deployment
metadata:
  name: trikonekt-backend-deployment
  namespace: trikonekt-prod
  labels:
    app: trikonekt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trikonekt-backend
  template:
    metadata:
      labels:
        app: trikonekt-backend
    spec:
      containers:
      - name: backend
        image: 65.0.40.184:5000/trikonekt-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: trikonekt-config
        - secretRef:
            name: trikonekt-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trikonekt-backend-service
  namespace: trikonekt-prod
spec:
  type: ClusterIP
  selector:
    app: trikonekt-backend
  ports:
  - port: 8000
    targetPort: 8000
