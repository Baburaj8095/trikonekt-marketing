apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trikonekt-ingress
  namespace: trikonekt-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - growth.vin
    - www.growth.vin
    - api.growth.vin
    secretName: growth-vin-tls-secret
  rules:
  - host: growth.vin
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: trikonekt-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trikonekt-frontend-service
            port:
              number: 80
  - host: www.growth.vin
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trikonekt-frontend-service
            port:
              number: 80
  - host: api.growth.vin
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trikonekt-backend-service
            port:
              number: 8000
