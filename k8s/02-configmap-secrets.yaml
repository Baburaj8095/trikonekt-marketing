apiVersion: v1
kind: ConfigMap
metadata:
  name: trikonekt-config
  namespace: trikonekt-prod
data:
  DJANGO_SETTINGS_MODULE: "core.settings"
  DEBUG: "False"
  ALLOWED_HOSTS: "api.growth.vin,growth.vin"
  CSRF_TRUSTED_ORIGINS: "https://growth.vin,https://www.growth.vin,https://api.growth.vin"
  CORS_ALLOWED_ORIGINS: "https://growth.vin,https://www.growth.vin"
  CORS_ALLOWED_ORIGIN_REGEXES: "^https://.*\\.growth\\.vin$"
  DRF_PAGE_SIZE: "25"
  DRF_THROTTLE_ANON: "60/min"
  DRF_THROTTLE_USER: "300/min"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: trikonekt-secrets
  namespace: trikonekt-prod
type: Opaque
stringData:
  SECRET_KEY: "replace-with-production-secret-key"
  DATABASE_URL: "postgres://trikonekt_admin:replace-password@replace-rds-endpoint:5432/trikonekt?sslmode=require"
  CLOUDINARY_URL: "cloudinary://349997823579756:WEKV9ofFRGunlYnJqCyxW38ureo@dbfupwnqp"
