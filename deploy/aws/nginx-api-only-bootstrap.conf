server {
    listen 80;
    listen [::]:80;
    server_name api.growth.vin;

    access_log /var/log/nginx/trikonekt-api.access.log;
    error_log /var/log/nginx/trikonekt-api.error.log;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        alias /srv/trikonekt/app/backend/staticfiles/;
    }

    location /media/ {
        alias /srv/trikonekt/app/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}
