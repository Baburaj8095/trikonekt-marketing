# Nginx Configuration for EC2 Instance 3 (Business API & Merchant Web Dashboard)
# Domain bindings: trikonektbusiness.com, api-captain.trikonektbusiness.com

server {
    listen 80;
    server_name trikonektbusiness.com www.trikonektbusiness.com api-captain.trikonektbusiness.com;
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name trikonektbusiness.com www.trikonektbusiness.com;

    ssl_certificate /etc/letsencrypt/live/trikonektbusiness.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trikonektbusiness.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/tri-business/build;
    index index.html;

    # Serve merchant portal UI
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api-captain.trikonektbusiness.com;

    ssl_certificate /etc/letsencrypt/live/api-captain.trikonektbusiness.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-captain.trikonektbusiness.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to Business Java backend (captain-service) on Port 8081
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
