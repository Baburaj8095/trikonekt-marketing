# Nginx Configuration for EC2 Instance 2 (Consumer API, Web Shop, & Super Admin CMS)
# Domain bindings: tri-consumer.com, admin.trikonekt.com, api.tri-consumer.com

server {
    listen 80;
    server_name tri-consumer.com www.tri-consumer.com admin.trikonekt.com api.tri-consumer.com;
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tri-consumer.com www.tri-consumer.com;

    ssl_certificate /etc/letsencrypt/live/tri-consumer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tri-consumer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/tri-consumer/frontend/build;
    index index.html;

    # Serve consumer eCommerce UI
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.trikonekt.com;

    ssl_certificate /etc/letsencrypt/live/admin.trikonekt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.trikonekt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/tri-consumer/frontend/build;
    index index.html;

    # Route requests directly to the consolidated Admin dashboard route
    location / {
        rewrite ^/$ /admin break;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.tri-consumer.com;

    ssl_certificate /etc/letsencrypt/live/api.tri-consumer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tri-consumer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to Consumer Java backend on Port 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
