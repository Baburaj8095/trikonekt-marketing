# Nginx Configuration for Trikonekt Education (trieducation.in & www.trieducation.in)

server {
    server_name trieducation.in www.trieducation.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /srv/trikonekt/tri-academy/frontend/dist;
    index index.html;

    client_max_body_size 500m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static Video Media Serving (Byte-Range chunked streaming)
    location /media/videos/ {
        alias /srv/trikonekt/media/videos/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # API Proxy to Node.js Academy Backend (Port 5005)
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
    }

    # Prevent aggressive caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA Client Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/trieducation.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trieducation.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.trieducation.in) {
        return 301 https://$host$request_uri;
    }
    if ($host = trieducation.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name trieducation.in www.trieducation.in;
    return 404;
}
