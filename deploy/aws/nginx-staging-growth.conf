# Nginx Configuration for Staging Environment (staging-growth.vin)
# Server block for HTTP -> HTTPS redirection
server {
    listen 80;
    listen [::]:80;
    server_name staging-growth.vin staging-api.growth.vin;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server block for Staging API (staging-api.growth.vin)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.growth.vin;

    ssl_certificate /etc/letsencrypt/live/staging-growth.vin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-growth.vin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/trikonekt-staging-api.access.log;
    error_log /var/log/nginx/trikonekt-staging-api.error.log;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Prevent search engine indexing of staging API
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    location /static/ {
        alias /srv/trikonekt/app-staging/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/trikonekt/app-staging/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001; # Staging Backend Port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}

# Server block for Staging Frontend (staging-growth.vin)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-growth.vin;

    ssl_certificate /etc/letsencrypt/live/staging-growth.vin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-growth.vin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/trikonekt/app-staging/frontend/build;
    index index.html;

    access_log /var/log/nginx/trikonekt-staging-frontend.access.log;
    error_log /var/log/nginx/trikonekt-staging-frontend.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Prevent search engine indexing of staging frontend
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    location /media/ {
        alias /srv/trikonekt/app-staging/backend/media/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/; # Staging Backend Port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|webp|svg|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
