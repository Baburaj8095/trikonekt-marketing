name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/aws/**"
      - ".github/workflows/deploy-backend-aws.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/trikonekt-prod-key.pem
          chmod 600 ~/.ssh/trikonekt-prod-key.pem

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/trikonekt-prod-key.pem \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo env DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash /srv/trikonekt/app/deploy/aws/deploy-backend.sh"
